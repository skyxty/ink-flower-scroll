name: Deploy 墨境花生 to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract site bundle
        run: |
          ls -la
          ARCHIVE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "No zip bundle found"; exit 1
          fi
          mkdir -p static-site
          unzip -o -q "$ARCHIVE" -d static-site
          echo "Extracted from $ARCHIVE"

      - name: Decode base64 assets
        run: |
          find static-site -name "*.b64" | while read -r f; do
            out="${f%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
            rm -f "$f"
          done
          echo "Decoded. Files in static-site:"
          find static-site -type f | head -n 50

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static-site
          force_orphan: true
          enable_jekyll: false
